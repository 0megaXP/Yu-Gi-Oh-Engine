name: Build

on:
  push:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch rules core, scripts and card data
        run: tools/bootstrap.sh
      - name: NumPy (tools/ml/train.py)
        run: python3 -m pip install --quiet --break-system-packages numpy || sudo apt-get install -y python3-numpy
      - name: Build and test
        run: tools/test.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Android library (AAR with engine + asset pack)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :ygoe:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: ygoe-android
          path: android/ygoe/build/outputs/aar/*.aar
